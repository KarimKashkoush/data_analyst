function skillsView(stu){const k=K.find(s=>s.id===skill),i=k.order,x=stu.filter(s=>s.scores[i]<.6).sort((a,b)=>a.scores[i]-b.scores[i]||a.total-b.total),a=stats(stu).find(s=>s.id===skill);return `<div class="section-header"><div><h2>من يحتاج التدريب؟ وعلى ماذا؟</h2><div class="muted" style="font-size:12px;margin-top:6px">اختيار المهارة يحدد القائمة والخطة المقترحة</div></div><select id="skill-select" aria-label="المهارة">${K.map(k=>`<option value="${k.id}" ${k.id===skill?'selected':''}>${k.section} — ${k.name}</option>`).join('')}</select></div><div class="grid"><section class="panel"><div class="skill-hero"><div><div class="eyebrow">${k.section} / ${k.id}</div><h2 style="font-size:25px;margin-top:8px">${k.name}</h2><p class="skill-desc">${k.description}</p></div><strong>${a.weak}<small>طالبًا يحتاجون للدعم</small></strong></div><div class="metric-inline"><div>متوسط المهارة<strong>${pct(a.mean)}</strong></div><div>أقل من 40%<strong style="color:${C.rust}">${a.severe}</strong></div><div>الترتيب في الأولوية<strong>${stats(stu).findIndex(s=>s.id===skill)+1}</strong></div></div><div class="small-h">التدخل التدريبي المقترح</div><p class="skill-desc">${k.action}. جلسة قصيرة تشرح طريقة التفكير، ثم تطبيق متدرج، ثم مناقشة الأخطاء وإعادة المحاولة.</p><div class="insight">قياس التقدم: اختبار مكافئ في المهارة. بلوغ 60% يعني الخروج من فئة الدعم؛ و80% هدف الإتقان.</div></section><section class="panel"><h2>مستويات المهارة</h2><div class="subtitle">تصنيف تربوي مقترح، قابل للتعديل في ملف Excel</div>${[['تأسيس عاجل',0,.4,C.rust],['دعم موجه',.4,.6,C.gold],['تطوير',.6,.8,C.stone],['إتقان',.8,1.01,C.teal]].map(([n,l,h,c])=>{const count=stu.filter(s=>s.scores[i]>=l&&s.scores[i]<h).length;return `<div class="bar-row"><span>${n}</span><div class="track"><div class="fill" style="width:${count/stu.length*100}%;background:${c}"></div></div><b>${count}</b></div>`}).join('')}<div class="insight">الاحتياج يشمل <b>${pct(a.weak/stu.length)}</b> من الطلاب في الفلتر الحالي. يمكن توزيعهم إلى مجموعة تأسيس وأخرى تدريب موجه.</div></section><section class="panel wide"><div class="panel-top"><h2>طلاب الدعم في ${k.name}</h2><button class="outline" id="export-skill">تصدير القائمة CSV</button></div><div class="subtitle">مرتبون من الأقل أداءً في المهارة. اضغط الطالب لفتح ملفه.</div><div class="table-wrap"><table><thead><tr><th>الطالب</th><th>الفصل</th><th>نتيجة المهارة</th><th>الإجمالي</th><th>أولوية التدخل</th></tr></thead><tbody>${x.map(s=>`<tr data-id="${s.id}"><td><b>${s.name}</b><br><small>${s.id}</small></td><td>${s.class}</td><td style="color:${C.rust}"><b>${pct(s.scores[i])}</b></td><td>${pct(s.total)}</td><td>${status(s.priority)}</td></tr>`).join('')||'<tr><td colspan="5">لا يوجد طلاب دون حد الدعم في هذه المهارة.</td></tr>'}</tbody></table></div></section></div>`}
function studentsView(stu){const matches=stu.filter(s=>(!search||(s.name+' '+s.id).includes(search))&&(!priority||s.priority===priority)).sort((a,b)=>b.weak-a.weak||a.total-b.total);if(!stu.some(s=>s.id===selected))selected=stu[0]?.id;const s=stu.find(s=>s.id===selected);return `<div class="section-header"><div><h2>كل طالب له خريطة مهارات</h2><div class="muted" style="font-size:12px;margin-top:6px">${matches.length} طالبًا في القائمة • التحديد يعرض تفاصيل الطالب</div></div><div class="tools"><input id="search" value="${search}" placeholder="اسم الطالب أو رقمه" aria-label="بحث الطالب"><select id="priority" aria-label="أولوية التدخل"><option value="">كل الأولويات</option>${['دعم مكثف','دعم موجه','متابعة وإثراء'].map(p=>`<option ${p===priority?'selected':''}>${p}</option>`).join('')}</select></div></div><div class="student-grid"><section class="panel"><div class="table-wrap"><table><thead><tr><th>الطالب</th><th>الفصل</th><th>الإجمالي</th><th>مهارات ضعيفة</th><th>الأولوية</th></tr></thead><tbody>${rows(matches)}</tbody></table></div></section><section class="panel"><div class="profile-label">${s.id} • ${s.grade} • الفصل ${s.class}</div><h2 class="profile-name">${s.name}</h2>${status(s.priority)}<div class="metric-inline"><div>اللفظي<strong>${pct(s.verbal)}</strong></div><div>الكمي<strong>${pct(s.quant)}</strong></div><div>مهارات ضعيفة<strong style="color:${C.rust}">${s.weak}</strong></div></div>${K.map((k,i)=>`<div class="bar-row ${s.scores[i]<.6?'hot':''}"><span>${k.name}</span><div class="track"><div class="fill" style="width:${s.scores[i]*100}%"></div></div><b>${Math.round(s.scores[i]*100)}%</b></div>`).join('')}<div class="insight">${s.weak?'ابدأ بـ <b>'+s.worst+'</b>، ثم بقية المهارات دون 60% حسب مستوى الأداء.':'لا توجد مهارات دون 60%. استمر في التطوير نحو هدف الإتقان 80%.'}</div></section><section class="panel wide"><h2>خريطة المهارات للمجموعة الحالية</h2><div class="subtitle">النسبة داخل كل خلية تمنع الاعتماد على اللون وحده</div><div class="heat-legend"><span>بني: أقل من 60%</span><span>ذهبي فاتح: 60–79%</span><span>أخضر: 80% فأكثر</span></div><div class="table-wrap"><table><thead><tr><th>الطالب</th>${K.map(k=>`<th style="white-space:normal;min-width:105px">${k.name}</th>`).join('')}</tr></thead><tbody>${matches.map(s=>`<tr data-id="${s.id}"><td>${s.name}</td>${s.scores.map(v=>`<td class="heat-cell" style="background:${v<.6?'#F4E3D8':v<.8?'#F6EBCB':'#205A55'};color:${v>=.8?'white':'#173D39'}">${Math.round(v*100)}%</td>`).join('')}</tr>`).join('')}</tbody></table></div></section></div>`}
function futureView(stu){const b=mean(stu.map(s=>s.total)),p=mean(stu.map(scenario));return `<div class="notice"><b>سيناريو تخطيط، وليس توقعًا مؤكدًا.</b> لدينا اختبار أولي فقط. نختبر هنا أثر إغلاق جزء من فجوة المهارات الضعيفة إلى 80%، ولا نعرض تحسنًا فعليًا قبل القياس البعدي.</div><div class="kpis">${kpi('الأداء الأولي',pct(b),'النتيجة الحالية')}${kpi('نتيجة السيناريو',pct(p),'بافتراض تنفيذ التدخل')}${kpi('المكسب الافتراضي',(100*(p-b)).toFixed(1),'نقطة مئوية')}${kpi('تغطية القياس البعدي','0%','لم تسجل نتائج بعدية بعد',true)}</div><div class="grid"><section class="panel"><h2>كيف تتغير النتائج تحت هذا الافتراض؟</h2><div class="subtitle">التحسن يطبق فقط على المهارات الأقل من 60%</div><div class="legend"><span><i class="dot" style="background:${C.teal}"></i>أولي</span><span><i class="dot" style="background:${C.gold}"></i>سيناريو</span><span>0–100%</span></div>${K.map((k,i)=>{const v=mean(stu.map(s=>s.scores[i])),p=mean(stu.map(s=>{const x=s.scores[i];return x<.6?x+(.8-x)*closure:x}));return `<div class="paired-row"><span>${k.name}</span><div class="paired-track"><div class="track"><div class="fill" style="width:${v*100}%"></div></div><div class="track"><div class="fill second" style="width:${p*100}%"></div></div></div><b class="number">${(v*100).toFixed(0)} → ${(p*100).toFixed(0)}%</b></div>`}).join('')}</section><section class="panel"><h2>افتراض التدريب</h2><div class="subtitle">غيّر نسبة الفجوة المستهدف إغلاقها وشاهد الأثر</div><div class="control-block"><label for="closure"><span>نسبة إغلاق الفجوة</span><b id="closure-label">${Math.round(closure*100)}%</b></label><input id="closure" type="range" min="0" max="100" step="5" value="${closure*100}"><div class="legend" style="justify-content:space-between"><span>لا تحسن مفترض</span><span>بلوغ 80% للمهارات الضعيفة</span></div></div><div class="insight">مثال: مهارة نتيجتها 40%، فجوتها إلى 80% تساوي 40 نقطة. إغلاق ${Math.round(closure*100)}% منها يعطي ${(40+40*closure).toFixed(0)}%.</div><div class="small-h">ما الذي سيحوّل السيناريو إلى متابعة فعلية؟</div><div class="no-data"><b>بانتظار الاختبار البعدي</b>أدخل تاريخ القياس، وعدد الصحيح، وعدد الأسئلة لكل طالب ومهارة في Excel. حدّث Power BI لعرض المقارنة على السجلات المكتملة نفسها.</div><p class="skill-desc muted">يفضل اختبار مكافئ في المحتوى والصعوبة والوزن، مع تسجيل حضور التدريب. لا يمكن استنتاج أثر سببي للتدريب من مقارنة قبل وبعد وحدها.</p></section><section class="panel wide"><h2>خطة مقترحة من 8 أسابيع</h2><div class="phases">${[['01–02','تأسيس','مجموعات صغيرة للمهارات دون 40%'],['03–04','تدريب موجه','تطبيق على الأخطاء المتكررة لكل مهارة'],['05–06','تطبيق تحت الوقت','توازن الدقة مع إدارة زمن الاختبار'],['07–08','مراجعة وقياس','إعادة اختبار مكافئ وتحديث خطة الدعم']].map(p=>`<div class="phase"><span class="number">الأسبوع ${p[0]}</span><b>${p[1]}</b><span>${p[2]}</span></div>`).join('')}</div></section></div>`}
function render(){const stu=filtered();document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-pressed',b.dataset.tab===tab)});el('content').innerHTML=stu.length?({overview,skills:skillsView,students:studentsView,future:futureView}[tab])(stu):'<div class="panel empty">لا توجد بيانات لهذه المجموعة. أعد ضبط الفلاتر.</div>';bind()}
function bind(){document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{skill=b.dataset.skill;tab='skills';render()});document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=b.dataset.id;tab='students';render()});if(el('skill-select'))el('skill-select').onchange=e=>{skill=e.target.value;render()};if(el('search'))el('search').oninput=e=>{const p=e.target.selectionStart;search=e.target.value;render();el('search').focus();el('search').setSelectionRange(p,p)};if(el('priority'))el('priority').onchange=e=>{priority=e.target.value;render()};if(el('closure'))el('closure').onchange=e=>{closure=Number(e.target.value)/100;render()};if(el('closure'))el('closure').oninput=e=>el('closure-label').textContent=e.target.value+'%';if(el('export-skill'))el('export-skill').onclick=()=>{const i=K.find(s=>s.id===skill).order,rows=[['StudentID','الطالب','الفصل','المهارة','النسبة','الأولوية'],...filtered().filter(s=>s.scores[i]<.6).map(s=>[s.id,s.name,s.class,K[i].name,s.scores[i],s.priority])];const blob=new Blob(['\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Maali_'+skill+'_support.csv';a.click();URL.revokeObjectURL(a.href)}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});el('grade').onchange=()=>{el('class').value='';render()};el('class').onchange=render;el('reset').onclick=()=>{el('grade').value='';el('class').value='';search='';priority='';closure=.5;render()};render();
</script></body></html>
